name: Build

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md', 'docs/**', '.gitignore' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Builds every board from a clean checkout, which is what catches an
# uncommitted header or a .gitignore'd dependency that a local build can see.
# The images are built with `release.sh --dist-only`, so they are laid out
# exactly as a release's (versioned VERSION+<commit>), and kept as workflow
# artifacts for 14 days.
#
# This workflow must NOT publish release assets; release.yml is the only
# thing that does. Release commits carry [skip ci] and do not run this.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # dist-only names the build from VERSION and the tags

      - name: Validate release targets
        run: ./scripts/release.sh --check-targets

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio 'esptool==4.11.0'

      - name: Unit tests
        run: pio test -e native

      - name: Build firmware
        run: ./scripts/release.sh --dist-only --no-clean

      - uses: actions/upload-artifact@v4
        with:
          name: platy-aprs-${{ github.sha }}
          path: |
            dist/*.bin
            dist/flash.sh
            dist/BUILD-INFO.txt
            dist/SHA256SUMS
          retention-days: 14
