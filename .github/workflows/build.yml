name: Build

on:
  push:
    branches: [ main ]          # catch breakage while it's cheap to fix
    # Skip the build for pushes that cannot change a binary.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - '.gitignore'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Only the newest push on a ref is worth checking.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# What this job is for: building from a CLEAN CHECKOUT.
#
# A local `pio run` reuses .pio caches and can see untracked files, so it cannot
# catch an uncommitted header or a .gitignore'd dependency. This job can.
#
# It is a breakage check on ordinary work, not a release gate. Releases are cut
# by .github/workflows/release.yml, which does its own clean build of every
# board. Release commits carry [skip ci] and do not run this, so a release's
# build log is in its release.yml run, not here.
#
# This workflow must NOT publish release assets; release.yml is the single
# source of truth for them. Its images are deliberately not archived either:
# they are not byte-identical to what ships. For images of an unreleased tree,
# run `./scripts/release.sh --dist-only` locally.

jobs:
  build:
    name: PlatformIO build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release target contract
        run: ./scripts/release.sh --check-targets

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Unit tests
        run: pio test -e native

      # --disable-auto-clean, as in scripts/release.sh: PlatformIO otherwise
      # deletes every environment's build output when the project checksum
      # moves between two `pio run`s, and the headroom step would see nothing.
      - name: Build firmware (verify all environments compile)
        run: |
          pio run -e m9 --disable-auto-clean
          pio run -e wio-tracker-l2 --disable-auto-clean
          pio run -e tdeck-plus --disable-auto-clean
          pio run -e mesh-deck --disable-auto-clean
          pio run -e crowpanel-35 --disable-auto-clean
          pio run -e crowpanel-50 --disable-auto-clean
          pio run -e tlora-pager --disable-auto-clean
          pio run -e tdeck-pro --disable-auto-clean

      # Flash headroom, tightest board first, so the next one to approach its
      # ceiling is visible here rather than in a failed release. The floor is a
      # ratchet: raise it as boards grow, don't let it drift to zero.
      - name: Flash headroom
        run: python3 tools/flash_headroom.py --min-free 524288 --require-all
