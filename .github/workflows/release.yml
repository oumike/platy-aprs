name: Release

# Cuts a release end to end: builds every board with the version baked in,
# merges the factory images, commits VERSION, tags and publishes. Normally
# started by `./scripts/release.sh` on a maintainer's machine, which checks the
# tree and dispatches this; it can also be run from the Actions tab.
#
# Manual only. Nothing here fires on a push or a tag.
#
# Release notes are RELEASE_NOTES.md as committed (draft them with
# `./scripts/release.sh --notes-only`), or GitHub's generated notes when that
# file is missing or empty.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel (alpha = GitHub prerelease)'
        type: choice
        options: [stable, alpha]
        default: stable
      version:
        description: 'Exact version, e.g. 0.2.0 (blank = bump the latest tag)'
        type: string
        default: ''

# One release at a time, never cancelled mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write        # push the release commit and tag, create the release

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The next version is derived from the full tag list.
          fetch-depth: 0

      - name: Configure git for the release commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO toolchains
        # Only ~/.platformio. Build output in .pio/ is never cached, so a
        # release image cannot pick up an object file from an earlier run.
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO and esptool
        # esptool is pinned: esptool 5 renamed merge_bin and its flags.
        run: pip install platformio 'esptool==4.11.0'

      - name: Unit tests
        run: pio test -e native

      - name: Cut the release
        id: cut
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read through the environment, never interpolated into the script,
          # so a dispatch input cannot inject shell.
          CHANNEL: ${{ inputs.channel }}
          REQ_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # --no-clean is safe here: this is a fresh checkout with no .pio/.
          args=(-y --no-clean)
          if [ "$CHANNEL" = "alpha" ]; then args+=(--alpha); fi
          if [ -n "$REQ_VERSION" ]; then args+=(--version "$REQ_VERSION"); fi
          ./scripts/release.sh "${args[@]}"
          echo "tag=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Archive debug symbols
        # The .elf files match the published images exactly; they are what a
        # crash backtrace decodes against. Kept out of the release itself.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ steps.cut.outputs.tag }}
          path: dist/*.elf
          retention-days: 90
