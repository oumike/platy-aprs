; rhino-aprs — APRS client firmware (BLE KISS TNC + LVGL UI + web config)

[platformio]
default_envs = m9

[common]
lib_deps_esp32 =
    lovyan03/LovyanGFX@^1.2.7
    lvgl/lvgl@~9.2.2
    bblanchon/ArduinoJson@^7.2.1
    h2zero/NimBLE-Arduino@^2.3.0

; Elecrow ThinkNode M9 — ESP32-S3R8, 16 MB flash, 8 MB OPI PSRAM, 2.4" ST7789,
; I2C QWERTY + d-pad, CC1167Q GPS, microSD, LR1110 (unused for now).
[env:m9]
platform = espressif32@6.11.0
board = thinknode_m9
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DDEVICE_M9=1
    -DBOARD_HAS_PSRAM
    ; The M9 console is an external UART bridge, not native USB-CDC.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Isrc
lib_deps = ${common.lib_deps_esp32}

; Host-side unit tests for the pure-logic modules (APRS, KISS, AX.25 …).
[env:native]
platform = native
build_flags = -std=gnu++17 -Isrc -DUNITY_INCLUDE_DOUBLE
; Only the pure-logic directories; they must not depend on Arduino.
test_build_src = yes
build_src_filter = -<*> +<aprs/> +<ax25/> +<kiss/> +<util/>
lib_compat_mode = off
