; Attaky Mesh Deck — ESP32-S3-WROOM-1U-N16R8, 2.0" ST7789 + FT6636 touch,
; d-pad on an AW9523 expander (no navigation keys), SX1262 (crystal),
; ATGM336H GPS, MAX17048 fuel gauge, no SD slot. Console is UART0 through the
; on-board USB-UART bridge, not native USB.
[env:mesh-deck]
platform = espressif32@6.11.0
board = mesh_deck
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
; A warm reset straight out of download mode can hang this board (camillia-mt);
; it is left halted after upload: power-cycle it to boot.
board_upload.after_reset = no_reset
extra_scripts = pre:tools/set_app_version.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DDEVICE_MESH_DECK=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Isrc
lib_deps = ${common.lib_deps_esp32}

