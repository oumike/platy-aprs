; Elecrow CrowPanel Advance 5.0" — ESP32-S3-WROOM-1-N16R8, 800x480 ST7262 RGB
; panel, GT911 touch, SX1262 in the wireless slot (DIP switch set to the wireless
; module). No SD card, GPS or battery sense. The flash wraps keep the panel steady
; during flash writes (src/hal/flash_panel_pause.cpp).
[env:crowpanel-50]
platform = espressif32@6.11.0
board = crowpanel_50
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
extra_scripts = pre:tools/set_app_version.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DDEVICE_CROWPANEL_50=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Wl,--wrap=esp_flash_write
    -Wl,--wrap=esp_flash_erase_region
    -Iinclude
    -Isrc
lib_deps = ${common.lib_deps_esp32}

