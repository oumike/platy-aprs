; LilyGo T-Deck Pro — ESP32-S3, 16 MB flash, 8 MB QSPI PSRAM, 3.1" GDEQ031T10
; 240x320 monochrome e-paper with frontlight, CST328/CST3530 touch, TCA8418
; keyboard, SX1262, u-blox MIA-M10Q GPS, BQ25896 charger + BQ27220 gauge, microSD.
[env:tdeck-pro]
platform = espressif32@6.11.0
board = tdeck_pro
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_qspi
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
extra_scripts = pre:tools/set_app_version.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DDEVICE_TDECK_PRO=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    ; e-paper: no style transitions or scroll animations (each frame is a panel refresh)
    -DLV_THEME_DEFAULT_TRANSITION_TIME=0
    -DSCROLL_ANIM_TIME_MIN=0
    -DSCROLL_ANIM_TIME_MAX=0
    -Iinclude
    -Isrc
lib_deps =
    ${common.lib_deps_esp32}
    zinggjm/GxEPD2@1.6.9
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    https://github.com/CIRCUITSTATE/CSE_Touch/archive/b44f23b6f870b848f1fbe453c190879bc6cfaafa.zip
    https://github.com/CIRCUITSTATE/CSE_CST328/archive/refs/tags/v0.0.4.zip

; Host-side unit tests for the pure-logic modules (APRS, KISS, AX.25 …).
[env:native]
platform = native
build_flags = -std=gnu++17 -Isrc -DUNITY_INCLUDE_DOUBLE
; Only the pure-logic directories; they must not depend on Arduino.
test_build_src = yes
build_src_filter = -<*> +<aprs/> +<ax25/> +<kiss/> +<util/>
lib_compat_mode = off
