; platy-aprs — APRS client firmware (BLE KISS TNC + LVGL UI + web config)

[platformio]
default_envs = m9

[common]
lib_deps_esp32 =
    lovyan03/LovyanGFX@^1.2.27   ; 1.2.27+ for the Wio's Panel_NV3031B
    lvgl/lvgl@~9.6.0
    bblanchon/ArduinoJson@^7.2.1
    h2zero/NimBLE-Arduino@^2.3.0
    mikalhart/TinyGPSPlus@^1.1.0
    jgromes/RadioLib@~7.7.1

; Elecrow ThinkNode M9 — ESP32-S3R8, 16 MB flash, 8 MB OPI PSRAM, 2.4" ST7789,
; I2C QWERTY + d-pad, CC1167Q GPS, microSD, LR1110 (LoRa APRS).
[env:m9]
platform = espressif32@6.11.0
board = thinknode_m9
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
; Preproduction M9 LR1110s run firmware that rejects RadioLib's
; DriveDiosInSleepMode, turning begin() into -706. See the script.
; m9_upload_erase adds "-t upload_erase": erase + upload in one esptool session.
extra_scripts =
    pre:tools/set_app_version.py
    pre:tools/patch_radiolib_lr11x0.py
    post:tools/m9_upload_erase.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DDEVICE_M9=1
    -DBOARD_HAS_PSRAM
    ; The M9 console is an external UART bridge, not native USB-CDC.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Isrc
lib_deps = ${common.lib_deps_esp32}

; Seeed Wio Tracker L2 — ESP32-S3, 16 MB flash, 8 MB OPI PSRAM, NV3031B quad-SPI
; panel + GT911 touch (no keyboard), SX1262, L76K GPS, SDMMC microSD.
[env:wio-tracker-l2]
platform = espressif32@6.11.0
board = wio_tracker_l2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
extra_scripts = pre:tools/set_app_version.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DDEVICE_WIO_TRACKER_L2=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Isrc
; arduino-audio-driver drives the ES8311 codec for alert tones (as in camillia-mt).
lib_deps =
    ${common.lib_deps_esp32}
    https://github.com/pschatzmann/arduino-audio-driver/archive/v0.3.0.zip

